<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060e1d" />
      <stop offset="50%" stop-color="#0b172e" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 242, 254, 0.4)" />
      <stop offset="100%" stop-color="rgba(37, 99, 235, 0.1)" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="hudGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="480" rx="20" fill="url(#bgGrad)" />

  <!-- Cyber Grid Lines -->
  <g stroke="rgba(0, 242, 254, 0.08)" stroke-width="1">
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="400" x2="400" y2="400" />
    <line x1="80" y1="0" x2="80" y2="480" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="240" y1="0" x2="240" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
  </g>

  <!-- Hexagonal Tech Backdrop -->
  <polygon points="200,40 310,105 310,235 200,300 90,235 90,105" 
           fill="rgba(0, 242, 254, 0.04)" 
           stroke="rgba(0, 242, 254, 0.25)" 
           stroke-width="1.5" 
           stroke-dasharray="6,4" />

  <!-- Central Target Ring -->
  <circle cx="200" cy="170" r="95" fill="none" stroke="rgba(0, 242, 254, 0.15)" stroke-width="2" />
  <circle cx="200" cy="170" r="115" fill="none" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1.5" stroke-dasharray="4,8" />
  
  <!-- Operator Silhouette / Cyber Suit -->
  <!-- Shoulders & Body -->
  <path d="M 120 370 C 120 310, 160 280, 200 280 C 240 280, 280 310, 280 370 C 285 410, 310 440, 320 480 L 80 480 C 90 440, 115 410, 120 370 Z" 
        fill="#0f1f3d" 
        stroke="rgba(0, 242, 254, 0.3)" 
        stroke-width="2" />

  <!-- Chest Shield Armor Lines -->
  <path d="M 160 320 L 200 345 L 240 320 L 225 390 L 200 410 L 175 390 Z" 
        fill="url(#shieldGrad)" 
        stroke="#00f2fe" 
        stroke-width="1.5" 
        filter="url(#hudGlow)" />

  <!-- Head & Neck -->
  <path d="M 185 240 L 185 270 C 185 278, 215 278, 215 270 L 215 240 Z" fill="#15274d" />
  <ellipse cx="200" cy="180" rx="52" ry="65" fill="#15274d" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5" />

  <!-- Hair / Silhouette Profile -->
  <path d="M 150 170 C 148 135, 170 120, 200 120 C 235 120, 252 135, 250 170 C 245 145, 230 135, 200 135 C 170 135, 155 145, 150 170 Z" fill="#091224" />

  <!-- Holographic Cyber Visor / HUD Glasses -->
  <path d="M 162 165 C 162 155, 238 155, 238 165 L 234 185 C 234 192, 166 192, 166 185 Z" 
        fill="rgba(0, 242, 254, 0.85)" 
        filter="url(#glow)" />
  <line x1="168" y1="175" x2="232" y2="175" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />

  <!-- Tactical Headset / Comm Gear -->
  <path d="M 148 165 C 145 160, 142 185, 148 190 L 152 175 Z" fill="#00f2fe" filter="url(#hudGlow)" />
  <path d="M 148 185 Q 165 210, 185 210" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" />
  <circle cx="185" cy="210" r="3.5" fill="#38ef7d" filter="url(#hudGlow)" />

  <!-- Crosshair & Targeting Accents -->
  <g stroke="#00f2fe" stroke-width="1.5">
    <line x1="190" y1="80" x2="210" y2="80" />
    <line x1="200" y1="70" x2="200" y2="90" />
    <circle cx="200" cy="80" r="2" fill="#00f2fe" />
  </g>

  <!-- Biometric & Telemetry HUD Elements -->
  <text x="30" y="50" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">
    SOC_OPERATOR // ID: MW-2026
  </text>
  <text x="30" y="70" fill="rgba(148, 163, 184, 0.8)" font-family="'JetBrains Mono', monospace" font-size="9">
    SYSTEM: DEFENSIVE_ANALYSIS
  </text>

  <g transform="translate(30, 420)">
    <rect width="100" height="26" rx="4" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.3)" />
    <circle cx="14" cy="13" r="4" fill="#10b981" filter="url(#hudGlow)" />
    <text x="26" y="17" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">
      STATUS: ACTIVE
    </text>
  </g>

  <!-- Node Dots & Data Connections -->
  <g fill="#00f2fe" filter="url(#hudGlow)">
    <circle cx="90" cy="105" r="4" />
    <circle cx="310" cy="105" r="4" />
    <circle cx="90" cy="235" r="4" />
    <circle cx="310" cy="235" r="4" />
    <circle cx="200" cy="300" r="4" />
  </g>

  <!-- Technical Labels Right Side -->
  <text x="370" y="190" text-anchor="end" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">
    SIEM // TELEMETRY
  </text>
  <text x="370" y="205" text-anchor="end" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">
    SPLUNK :: WIRESHARK
  </text>
  <text x="370" y="220" text-anchor="end" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">
    LAT: 31.0409° N
  </text>
  <text x="370" y="235" text-anchor="end" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8">
    LON: 31.3785° E
  </text>
</svg>
